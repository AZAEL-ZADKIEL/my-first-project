<div class="container mt-4">
  <h2>Buscador de Libros</h2>

  <div class="row mb-3">
    <div class="col-sm-9">
      <input
        type="text"
        class="form-control"
        placeholder="cien años de soledad"
        [(ngModel)]="termino"
        (keyup.enter)="buscar()"
      >
    </div>
    <div class="col-sm-3">
      <button class="btn btn-primary w-100" (click)="buscar()">Buscar</button>
    </div>
  </div>

  <p *ngIf="mensaje()">{{ mensaje() }}</p>
  <p *ngIf="cargando()">Cargando...</p>

  <table class="table table-striped align-middle" *ngIf="libros().length > 0">
    <thead>
      <tr>
        <th>Foto autor</th>
        <th>Título</th>
        <th>Autor</th>
        <th>Año de publicación</th>
        <th>Idioma</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let libro of libros()">
        <td>
          <img *ngIf="libro.fotoUrl" [src]="libro.fotoUrl" class="foto-autor" alt="Foto autor">
          <span *ngIf="!libro.fotoUrl">Sin foto</span>
        </td>
        <td>{{ libro.titulo }}</td>
        <td>{{ libro.autor }}</td>
        <td>{{ libro.aniopublicacion }}</td>
        <td>{{ libro.idioma }}</td>
      </tr>
    </tbody>
  </table>
</div>
