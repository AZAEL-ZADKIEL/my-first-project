<div class="container mt-3">
  <button (click)="verapi()">mostrar todos</button>
  <button (click)="mostrar()">mostrar</button>
  <button (click)="mostrarmujeres()">mostrar solo mujeres</button>

  <hr>

  <table class="table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Imagen</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let i of datosMostrados()">
        <td>{{i.name}}</td>
        <td><img src="{{i.image}}"></td>
      </tr>
    </tbody>
  </table>
</div>
